name: Edge runtime CI

on:
  push:
    branches:
      - feat/complete-gpt-oss-edge-runtime
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  edge-runtime:
    name: Edge runtime checks
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      CARGO_NET_RETRY: "5"
      CARGO_HTTP_TIMEOUT: "120"
      CARGO_HTTP_MULTIPLEXING: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Resolve and fetch Rust dependencies
        run: |
          for i in 1 2 3 4 5; do
            cargo fetch && break
            if [ "$i" = 5 ]; then
              exit 1
            fi
            sleep $((i * 10))
          done

      - name: Validate resolved lockfile
        run: cargo metadata --locked --offline --no-deps --format-version 1 >/dev/null

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Check CLI
        run: cargo check --locked -p mistralrs-cli

      - name: Test quantization crate
        run: cargo test --locked -p mistralrs-quant

      - name: Test CLI crate
        run: cargo test --locked -p mistralrs-cli
