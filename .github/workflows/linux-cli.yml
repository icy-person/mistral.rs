name: Linux CLI

on:
  push:
    branches:
      - master
      - linux-cli-only
      - verify/gpt-oss-final-response
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-cli-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_TIMEOUT: "120"
  CARGO_HTTP_MULTIPLEXING: "false"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  RUSTFLAGS: "-C target-cpu=generic"

jobs:
  build-linux-cli:
    name: Linux x86_64 CLI and GPT-OSS model benchmark
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Resolve and fetch Rust dependencies
        run: |
          for i in 1 2 3 4 5; do
            cargo fetch && break
            if [ "$i" = 5 ]; then
              exit 1
            fi
            sleep $((i * 20))
          done

      - name: Validate resolved lockfile
        run: cargo metadata --locked --offline --no-deps --format-version 1 >/dev/null

      - name: Build Linux CLI
        run: cargo build --release --locked --offline -p mistralrs-cli

      - name: Verify executable
        run: |
          file target/release/mistralrs
          ./target/release/mistralrs --help >/dev/null
          ./target/release/mistralrs stream --help >/dev/null
          test -x target/release/mistralrs

      - name: Run GPT-OSS 20B buffered-stream response smoke test
        id: model-smoke
        continue-on-error: true
        env:
          RUST_LOG: error
          # Separate the buffered streaming path from zero-copy promotion.
          MISTRALRS_MOE_ZERO_COPY: "false"
          MISTRALRS_MOE_OVERLAP: "false"
          # Keep whole-MLP fusion out of the smoke test; the bench profiles cover it separately.
          MISTRALRS_MOE_FUSED_ROUTE_LIMIT: "1"
        run: |
          curl --fail --location --retry 5 --retry-all-errors \
            --output gpt-oss-20b-MXFP4.gguf \
            "https://huggingface.co/ggml-org/gpt-oss-20b-GGUF/resolve/main/gpt-oss-20b-MXFP4.gguf"
          ./target/release/mistralrs run \
            --cpu \
            -f "$PWD/gpt-oss-20b-MXFP4.gguf" \
            --moe-stream \
            --cache-mb 1024 \
            --cache-floor-mb 1024 \
            --cache-ceil-mb 1024 \
            --io-threads 4 \
            --reasoning-effort low \
            --max-tokens 2048 \
            -i "Reply with exactly this number and nothing else: 323" \
            2>model.stderr | tee model.stdout
          mkdir -p gpt-oss-moe-benchmark
          cp model.stdout model.stderr gpt-oss-moe-benchmark/
          echo "===== GPT-OSS MODEL STDOUT ====="
          cat model.stdout
          echo "===== GPT-OSS MODEL STDERR ====="
          cat model.stderr
          echo "===== END GPT-OSS MODEL LOGS ====="
          # Require the expected answer in final visible text, not in GPT-OSS reasoning.
          # The CLI wraps reasoning in ANSI gray/reset markers and prints stats after "Stats:".
          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          output = Path("model.stdout").read_text(errors="replace")
          output = re.sub(r"\x1b\[90m.*?\x1b\[0m", "", output, flags=re.S)
          output = re.sub(r"\x1b\[[0-?]*[ -/]*[@-~]", "", output)
          answer = output.split("Stats:", 1)[0].strip()
          print("===== FINAL VISIBLE ANSWER =====")
          print(answer or "<EMPTY>")
          if not re.search(r"(?<!\d)323(?!\d)", answer):
              print("ERROR: model did not emit the expected final answer '323'", file=sys.stderr)
              sys.exit(1)
          PY

      - name: Compare GPT-OSS streaming configurations on the real model
        # This diagnostic branch validates user-visible response only; the PR branch keeps full profiles.
        if: false
        env:
          RUST_LOG: info
          MISTRALRS_MOE_FUSED_ROUTE_LIMIT: "16"
        run: |
          MISTRALRS_BIN="$PWD/target/release/mistralrs" \
            CONTEXT=1024 \
            PROMPT_LEN=128 \
            GEN_LEN=128 \
            DEPTH=128 \
            ITERATIONS=1 \
            WARMUP=1 \
            CACHE_MB=512 \
            CACHE_FLOOR_MB=512 \
            CACHE_CEIL_MB=512 \
            bash scripts/bench_moe_stream.sh \
              "$PWD/gpt-oss-20b-MXFP4.gguf" \
              "$PWD/gpt-oss-moe-benchmark"

      - name: Enforce GPT-OSS response smoke test result
        if: always() && steps.model-smoke.outcome == 'failure'
        run: |
          echo "GPT-OSS inference returned no visible text response; see model.stdout/model.stderr artifact."
          exit 1

      - name: Upload GPT-OSS benchmark logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpt-oss-20b-real-model-benchmark
          path: gpt-oss-moe-benchmark/
          if-no-files-found: warn
          retention-days: 14

      - name: Package CLI
        run: |
          mkdir -p dist
          tar -C target/release -czf dist/mistralrs-linux-x86_64.tar.gz mistralrs
          sha256sum dist/mistralrs-linux-x86_64.tar.gz > dist/mistralrs-linux-x86_64.tar.gz.sha256

      - name: Upload Linux CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: mistralrs-linux-x86_64
          path: |
            dist/mistralrs-linux-x86_64.tar.gz
            dist/mistralrs-linux-x86_64.tar.gz.sha256
          if-no-files-found: error
          overwrite: true